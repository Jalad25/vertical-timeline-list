name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below so the issue can be reproduced and triaged quickly.

        **Before you copy the plugin details for a bug report,** make sure your vault is set up exactly the way it is when the bug occurs: same active theme, same community plugins enabled, same color scheme. The "Copy details for bug report" button captures that state, so it needs to match the broken state to be useful.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting.
      options:
        - label: I have searched [existing issues](../issues?q=is%3Aissue) and this has not already been reported.
          required: true
        - label: I am using the latest version of the plugin.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, step-by-step path to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or console output.
    validations:
      required: true

  - type: textarea
    id: timeline-source
    attributes:
      label: Example timeline list (if relevant)
      description: If the bug involves a specific timeline, paste the markdown source here. Redact any personal information.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: plugin-details
    attributes:
      label: Plugin details
      description: With your vault configured as it is when the bug occurs, open the plugin's settings tab, click "Copy details for bug report", and paste the result here. This captures plugin version, Obsidian version, color scheme, active theme, installed themes, enabled community plugins, and a dump of your `data.json` containing the plugin's settings.
      render: text
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true

  - type: dropdown
    id: color-scheme
    attributes:
      label: Color Scheme
      description: Which color scheme does the bug occur in? If you haven't checked the other color scheme, please try to reproduce there as well, some issues are theme-specific.
      options:
        - Both light and dark mode
        - Light mode only
        - Dark mode only
        - Not applicable / not visual
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: If applicable, add screenshots or a short recording to help explain the problem.
    validations:
      required: false
